<div class="{{ css }}">
  <label for="{{ field.id_for_label }}" class="field-label mb-1.5 block text-[11px] font-bold uppercase tracking-[0.18em] text-neutral-600">
    {{ field.label }}{% if not field.field.required %} <span class="font-medium normal-case tracking-normal text-neutral-400">(optional)</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="mt-1.5 text-xs text-neutral-500 [&_ul]:list-disc [&_ul]:pl-4">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="mt-1.5 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
</div>
