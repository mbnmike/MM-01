<article class="group">
  <a href="{{ post.get_absolute_url }}" class="relative block aspect-[16/9] overflow-hidden bg-neutral-900" tabindex="-1" aria-hidden="true">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" alt="" loading="lazy" decoding="async"
        {% if post.cover_width %}width="{{ post.cover_width }}" height="{{ post.cover_height }}"{% endif %}
        {% if post.cover_thumb %}srcset="{{ post.cover_thumb.url }} 960w, {{ post.cover_image.url }} {{ post.cover_width|default:2400 }}w" sizes="(min-width: 1024px) 960px, 100vw"{% endif %}
        class="h-full w-full object-cover transition duration-700 ease-out group-hover:scale-[1.03]">
    {% else %}
      <span class="flex h-full w-full items-end bg-[radial-gradient(ellipse_at_top_right,_#2c570e_0%,_#0a0a0a_65%)] p-6 text-2xl font-semibold leading-tight text-white/90 md:p-10 md:text-4xl">{{ post.title|truncatewords:10 }}</span>
    {% endif %}
  </a>
  <h3 class="mt-6 text-2xl font-semibold leading-tight tracking-[-0.02em] text-white md:text-[2.1rem]">
    <a href="{{ post.get_absolute_url }}" class="transition group-hover:text-forest-light">{{ post.display_title }}</a>
  </h3>
  {% if post.published_at %}
    <p class="mt-3 text-sm text-neutral-400">on <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"Y/m/d" }}</time></p>
  {% endif %}
</article>
