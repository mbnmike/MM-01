<article class="group flex flex-col">
  <a href="{{ post.get_absolute_url }}" class="relative block aspect-[4/3] overflow-hidden bg-neutral-100" tabindex="-1" aria-hidden="true">
    {% if post.card_image %}
      <img src="{{ post.card_image.url }}" alt="" loading="lazy" decoding="async" width="960" height="720"
        class="h-full w-full object-cover transition duration-700 ease-out group-hover:scale-[1.03]">
    {% else %}
      <span class="flex h-full w-full items-end bg-ink p-5 font-display text-2xl uppercase leading-none text-white/90">{{ post.title|truncatewords:6 }}</span>
    {% endif %}
  </a>
  <p class="mt-5 text-[11px] font-bold uppercase tracking-[0.18em] text-forest">
    <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"M j, Y" }}</time>
  </p>
  <h3 class="mt-2 text-xl font-bold leading-snug tracking-tight md:text-[1.4rem]">
    <a href="{{ post.get_absolute_url }}" class="bg-[length:0%_2px] bg-left-bottom bg-no-repeat bg-gradient-to-r from-forest to-forest transition-[background-size] duration-300 group-hover:bg-[length:100%_2px]">{{ post.title }}</a>
  </h3>
  {% if post.excerpt %}<p class="mt-2 line-clamp-3 font-serif text-[1.02rem] leading-relaxed text-neutral-600">{{ post.excerpt }}</p>{% endif %}
  <p class="mt-3 text-xs text-neutral-400">{{ post.reading_minutes }} min read</p>
</article>
