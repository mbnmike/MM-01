<div class="lot-field{% if check %} is-check{% endif %}{% if field.errors %} has-error{% endif %}">
  {% if check %}
    <label>{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {{ field.errors }}
  {% if field.help_text %}<p class="lot-help-text">{{ field.help_text }}</p>{% endif %}
</div>
