{% load store %}
<a href="{{ product.get_absolute_url }}" class="group block text-center">
  <div class="relative aspect-square overflow-hidden bg-white">
    {% with img=product.primary_image %}
      {% if img %}
        <img src="{{ img.image.url }}" alt="{{ img.alt|default:product.name }}" loading="lazy"
          class="absolute inset-0 h-full w-full object-contain p-3 transition duration-500 group-hover:scale-[1.04]">
      {% endif %}
    {% endwith %}
    {% if not product.in_stock %}
      <span class="absolute left-2 top-2 bg-ink px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.15em] text-white">Sold out</span>
    {% elif product.on_sale %}
      <span class="absolute left-2 top-2 bg-forest px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.15em] text-white">Sale</span>
    {% endif %}
  </div>
  <p class="mt-4 text-sm tabular-nums text-neutral-800">
    {% if product.on_sale %}<span class="mr-1 text-neutral-400 line-through">{{ product.compare_at_price|money }}</span>{% endif %}{{ product.price|money }}
  </p>
  <p class="mx-auto mt-3 max-w-[16rem] text-[13px] uppercase leading-snug tracking-[0.04em] text-ink group-hover:underline">{{ product.name }}</p>
</a>
